[project]
name = "autfin"
version = "7.0.0"
description = "AutFin — Autonomous AI-Powered Financial Research & Portfolio Management System"
requires-python = ">=3.11"
authors = [
    {name = "Prakhar"}
]

dependencies = [
    # Pydantic AI (core)
    "pydantic-ai>=2.68.0",
    "pydantic-ai-harness[codemode,dynamic-workflow]>=0.68.0",
    "pydantic-evals>=2.68.0",
    # Pydantic
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Model providers (NVIDIA NIM uses OpenAI-compatible API)
    "openai>=1.0.0",
    # Data & Analysis
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "yfinance>=0.2.0",
    # Zerodha Kite SDK
    "kiteconnect>=5.0.0",
    "pyotp>=2.9.0",
    # Storage
    "chromadb>=0.5.0",
    "aiosqlite>=0.19.0",
    # Web
    "httpx>=0.27.0",
    # Sentiment
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "vaderSentiment>=3.3.2",
    # Utilities
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    # Observability
    "logfire[variables]>=4.41.0",
    "pydantic-ai-slim[duckduckgo,mcp]>=2.68.0",
    "pandas-ta-classic>=0.6.52",
    "backtesting>=0.6.6",
    "vectorbt>=1.1.0",
    "plotly>=5.0,<7.0",
]

[project.optional-dependencies]
technical = [
    "TA-Lib>=0.6.0",
    "pandas-ta-classic>=0.6.0",
]
pydantic_ai = [
    "pydantic-ai-harness[skills,logfire,stackone]>=0.68.0",
    "pydantic-evals>=2.68.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autfin = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    # Explicit, not transitive: pytest and pytest-asyncio used to arrive via a
    # pydantic-ai extra, and `uv sync` dropped them when that extra changed,
    # which made `uv run pytest` fall back to a system interpreter with no
    # pydantic_ai installed.
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

