[project]
name = "autfin"
version = "0.1.0"
description = "AutFin — Autonomous AI-Powered Financial Research & Portfolio Management System"
requires-python = ">=3.11"
authors = [
    {name = "Prakhar"}
]

dependencies = [
    # Orchestration
    "langgraph>=1.0.0",
    "langchain-core>=0.3.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    
    # Zerodha Kite SDK
    "kiteconnect>=5.0.0",
    "pyotp>=2.9.0",
    "requests>=2.31.0",
    
    # Data & Analysis
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "yfinance>=0.2.0",
    
    # Storage
    "chromadb>=0.5.0",
    "aiosqlite>=0.19.0",
    
    # Web Scraping
    "httpx>=0.27.0",

    # Browser MCP — hard runtime dependency for JS-rendered / anti-bot sites
    # (NSE Cloudflare, Moneycontrol, Screener.in, Economic Times, Reddit no-API path).
    # Obscura binary is the actual browser (Apache-2.0 Rust, 70 MB).
    # This package binds MCP tools into LangGraph bind_tools() / ToolNode.
    "mcp>=1.9.2",
    "langchain-mcp-adapters>=0.3.0",
    
    # Scheduling
    "apscheduler>=3.10.0",
    
    # LLM — openai SDK connects directly to OpenAI-compatible endpoints
    "openai>=1.0.0",

    # Sentiment (FinBERT + VADER)
    "transformers>=4.30.0",
    "vaderSentiment>=3.3.2",

    # Social sentiment (Reddit)
    "praw>=7.7.0",

    # Observability
    "langsmith>=0.3.0",
    
    # Utilities
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.35.0",
]
technical = [
    "TA-Lib>=0.6.0",
    "pandas-ta-classic>=0.6.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autfin = ["py.typed"]

[project.scripts]
autfin = "autfin.cli.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"